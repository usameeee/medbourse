openapi: 3.1.0
info:
  title: MEDBOURSE API
  version: 0.0.1
  description: |
    Machine-readable specification for the MEDBOURSE REST API (Express 5).
    All routes are mounted under `/api/v1`. Authentication is accepted either via
    the HTTP-only `mb_access` cookie (`cookieAuth`) or an `Authorization: Bearer <token>`
    header (`bearerAuth`).
servers:
  - url: http://localhost:4000/api/v1
    description: development
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Users
  - name: Country assignments
  - name: Invitations
  - name: Catalog
  - name: Pricing rules
  - name: Payment accounts
  - name: Quotations
  - name: Payment evidence
  - name: Cases
  - name: Documents
  - name: Workflow templates
  - name: Audit
  - name: Notifications
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health and version
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a customer account and set the access cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                EMAIL_IN_USE:
                  value:
                    error:
                      code: EMAIL_IN_USE
                      message: An account with this email already exists
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and set the access cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Invalid email or password
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear the access cookie
      security: []
      responses:
        '204':
          description: Cookie cleared
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current authenticated user (no password hash)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/staff-check:
    get:
      tags: [Auth]
      operationId: staffCheck
      summary: RBAC probe for `case:create:staff` (staff and above)
      responses:
        '200':
          description: Caller has the required permission
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Office-created customer record (no login). Requires `customer:create:staff`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerBody'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate customer email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                CUSTOMER_EMAIL_IN_USE:
                  value:
                    error:
                      code: CUSTOMER_EMAIL_IN_USE
                      message: A customer with this email already exists
                      details:
                        customerId: 64b7f0c2e1a2b3c4d5e6f7a8
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Paginated customer list. Requires `customer:read:staff`
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          required: false
          description: Case-insensitive search on full name and email
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Paginated customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMetaEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCustomer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /customers/queue/unassigned:
    get:
      tags: [Customers]
      operationId: listUnassignedCustomers
      summary: Unassigned and exception customers. Requires `customer:read:staff`
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated unassigned/exception customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMetaEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCustomer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: One customer record (staff reader or the linked customer)
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Customer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/assignment:
    post:
      tags: [Customers]
      operationId: reassignCustomer
      summary: Manual reassignment with reason (audited). Requires `assignment:manage:admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignBody'
      responses:
        '200':
          description: Customer reassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
        '400':
          description: Validation failure or invalid manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_MANAGER:
                  value:
                    error:
                      code: INVALID_MANAGER
                      message: Manager must be an active staff, admin, or super_admin account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/invitations:
    post:
      tags: [Customers]
      operationId: issueInvitation
      summary: Issue an invitation; returns `{ invitation, token }` once. Requires `customer:create:staff`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteBody'
      responses:
        '201':
          description: Invitation issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithTokenEnvelope'
        '400':
          description: Email missing or mismatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                EMAIL_REQUIRED:
                  value:
                    error:
                      code: EMAIL_REQUIRED
                      message: Provide an email for this invitation
                EMAIL_MISMATCH:
                  value:
                    error:
                      code: EMAIL_MISMATCH
                      message: Invitation email must match the customer record email
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Customer is already linked to an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                CUSTOMER_ALREADY_LINKED:
                  value:
                    error:
                      code: CUSTOMER_ALREADY_LINKED
                      message: This customer record is already linked to an account
  /customers/{id}/invitations/{invitationId}/revoke:
    post:
      tags: [Customers]
      operationId: revokeInvitation
      summary: Revoke an unused invitation. Requires `customer:create:staff`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation state (revoked if it was usable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/managers:
    get:
      tags: [Users]
      operationId: listAssignableManagers
      summary: Active assignable managers (staff/admin/super_admin). Requires `assignment:manage:admin`
      responses:
        '200':
          description: Assignable managers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /country-assignments:
    get:
      tags: [Country assignments]
      operationId: listCountryAssignments
      summary: Country to manager maps. Requires `assignment:manage:admin`
      responses:
        '200':
          description: Country assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryAssignmentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Country assignments]
      operationId: upsertCountryAssignment
      summary: Upsert a country map. Requires `assignment:manage:admin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCountryAssignmentBody'
      responses:
        '200':
          description: Existing map updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryAssignmentEnvelope'
        '201':
          description: New map created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryAssignmentEnvelope'
        '400':
          description: Validation failure or invalid manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_MANAGER:
                  value:
                    error:
                      code: INVALID_MANAGER
                      message: Each manager must be an active staff, admin, or super_admin account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Consume an invitation token and link the session user to the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationBody'
      responses:
        '200':
          description: Account linked to the customer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invitation invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_INVITATION:
                  value:
                    error:
                      code: INVALID_INVITATION
                      message: Invitation is invalid or expired
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only a customer account can accept this invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: Only a customer account can accept this invitation
        '409':
          description: Account or customer record already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                ALREADY_LINKED:
                  value:
                    error:
                      code: ALREADY_LINKED
                      message: This account is already linked to a customer record
                CUSTOMER_ALREADY_LINKED:
                  value:
                    error:
                      code: CUSTOMER_ALREADY_LINKED
                      message: This customer record is already linked to an account
  /catalog/cities:
    get:
      tags: [Catalog]
      operationId: listCities
      summary: Public city list (active only unless a super admin requests inactive)
      security: []
      parameters:
        - $ref: '#/components/parameters/IncludeInactiveParam'
        - $ref: '#/components/parameters/CategoryFilterParam'
        - $ref: '#/components/parameters/ProviderIdFilterParam'
        - $ref: '#/components/parameters/CityIdFilterParam'
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createCity
      summary: Create a city. Requires `catalog:manage:super_admin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityBody'
      responses:
        '201':
          description: City created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                CITY_SLUG_IN_USE:
                  value:
                    error:
                      code: CITY_SLUG_IN_USE
                      message: A city with this slug already exists
  /catalog/cities/{id}:
    patch:
      tags: [Catalog]
      operationId: updateCity
      summary: Update a city. Requires `catalog:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityPatchBody'
      responses:
        '200':
          description: City updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                CITY_SLUG_IN_USE:
                  value:
                    error:
                      code: CITY_SLUG_IN_USE
                      message: A city with this slug already exists
  /catalog/providers:
    get:
      tags: [Catalog]
      operationId: listProviders
      summary: Public provider list (active only unless a super admin requests inactive)
      security: []
      parameters:
        - $ref: '#/components/parameters/IncludeInactiveParam'
        - $ref: '#/components/parameters/CategoryFilterParam'
        - $ref: '#/components/parameters/ProviderIdFilterParam'
        - $ref: '#/components/parameters/CityIdFilterParam'
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createProvider
      summary: Create a provider (`partnershipVerified` defaults false). Requires `catalog:manage:super_admin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderBody'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEnvelope'
        '400':
          description: Validation failure or invalid city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_CITY:
                  value:
                    error:
                      code: INVALID_CITY
                      message: City does not exist
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalog/providers/{id}:
    patch:
      tags: [Catalog]
      operationId: updateProvider
      summary: Update a provider. Requires `catalog:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPatchBody'
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEnvelope'
        '400':
          description: Validation failure or invalid city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_CITY:
                  value:
                    error:
                      code: INVALID_CITY
                      message: City does not exist
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalog/offerings:
    get:
      tags: [Catalog]
      operationId: listOfferings
      summary: Public offering list (active only unless a super admin requests inactive)
      security: []
      parameters:
        - $ref: '#/components/parameters/IncludeInactiveParam'
        - $ref: '#/components/parameters/CategoryFilterParam'
        - $ref: '#/components/parameters/ProviderIdFilterParam'
        - $ref: '#/components/parameters/CityIdFilterParam'
      responses:
        '200':
          description: Offerings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createOffering
      summary: Create an offering (disclaimer is server-set). Requires `catalog:manage:super_admin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferingBody'
      responses:
        '201':
          description: Offering created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingEnvelope'
        '400':
          description: Validation failure, invalid provider, or guarantee language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_PROVIDER:
                  value:
                    error:
                      code: INVALID_PROVIDER
                      message: Provider does not exist or is inactive
                GUARANTEE_LANGUAGE:
                  value:
                    error:
                      code: GUARANTEE_LANGUAGE
                      message: Offerings must not promise admission, visa, or clinical results
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                OFFERING_SLUG_IN_USE:
                  value:
                    error:
                      code: OFFERING_SLUG_IN_USE
                      message: An offering with this slug already exists
  /catalog/offerings/{id}:
    patch:
      tags: [Catalog]
      operationId: updateOffering
      summary: Update an offering. Requires `catalog:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferingPatchBody'
      responses:
        '200':
          description: Offering updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingEnvelope'
        '400':
          description: Validation failure, invalid provider, or guarantee language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_PROVIDER:
                  value:
                    error:
                      code: INVALID_PROVIDER
                      message: Provider does not exist or is inactive
                GUARANTEE_LANGUAGE:
                  value:
                    error:
                      code: GUARANTEE_LANGUAGE
                      message: Offerings must not promise admission, visa, or clinical results
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                OFFERING_SLUG_IN_USE:
                  value:
                    error:
                      code: OFFERING_SLUG_IN_USE
                      message: An offering with this slug already exists
  /pricing-rules:
    get:
      tags: [Pricing rules]
      operationId: listPricingRules
      summary: List pricing rules. Requires `catalog:manage:super_admin`
      responses:
        '200':
          description: Pricing rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingRuleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Pricing rules]
      operationId: createPricingRule
      summary: Create a pricing rule (`amount` decimal string + ISO `currency`). Requires `catalog:manage:super_admin`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRuleBody'
      responses:
        '201':
          description: Pricing rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingRuleEnvelope'
        '400':
          description: Validation failure or invalid offering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                INVALID_OFFERING:
                  value:
                    error:
                      code: INVALID_OFFERING
                      message: Offering does not exist
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payment-accounts:
    get:
      tags: [Payment accounts]
      operationId: listPaymentAccounts
      summary: List payment accounts. Requires `catalog:manage:super_admin`
      responses:
        '200':
          description: Payment accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
