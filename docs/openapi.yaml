      summary: Template with its current version. Requires `workflow:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Template and current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateWithNullableVersionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workflow templates]
      operationId: updateWorkflowTemplate
      summary: Update template metadata (`name`, `description`, `isActive`). Requires `workflow:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowTemplateBody'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workflow-templates/{id}/versions:
    get:
      tags: [Workflow templates]
      operationId: listWorkflowTemplateVersions
      summary: All versions newest first. Requires `workflow:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Template versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateVersionListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Workflow templates]
      operationId: createWorkflowTemplateVersion
      summary: Create a new version (stages replace the current one). Requires `workflow:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowTemplateVersionBody'
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateWithVersionEnvelope'
        '400':
          description: Validation failure or duplicate stage id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
              examples:
                DUPLICATE_STAGE_ID:
                  value:
                    error:
                      code: DUPLICATE_STAGE_ID
                      message: 'Duplicate stage id: intake'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workflow-templates/{id}/versions/{versionNumber}:
    get:
      tags: [Workflow templates]
      operationId: getWorkflowTemplateVersion
      summary: Read a specific version. Requires `workflow:manage:super_admin`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: versionNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Template version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateVersionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /audit:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Paginated audit logs. Requires `audit:read:super_admin`
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: entityType
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: actorUserId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Caller's notifications newest first (optional `unreadOnly`). Requires `notification:read:self`
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Notifications with unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all of the caller's notifications read. Requires `notification:read:self`
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one of the caller's notifications read. Requires `notification:read:self`
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mb_access
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeInactiveParam:
      name: includeInactive
      in: query
      required: false
      description: Only honored for super admins
      schema:
        type: string
        enum: ['true', 'false']
    CategoryFilterParam:
      name: category
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ServiceCategory'
    ProviderIdFilterParam:
      name: providerId
      in: query
      required: false
      schema:
        type: string
    CityIdFilterParam:
      name: cityId
      in: query
      required: false
      schema:
        type: string
    ExpParam:
      name: exp
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    SigParam:
      name: sig
      in: query
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed (`VALIDATION_ERROR`, Zod `flatten()` in `details`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
          examples:
            VALIDATION_ERROR:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
    Unauthorized:
      description: Authentication required (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
          examples:
            UNAUTHENTICATED:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication required
    Forbidden:
      description: Insufficient permissions (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
          examples:
            FORBIDDEN:
              value:
                error:
                  code: FORBIDDEN
                  message: Insufficient permissions
    NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
          examples:
            NOT_FOUND:
              value:
                error:
                  code: NOT_FOUND
                  message: Resource not found
  schemas:
    ApiErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    HealthResponse:
      type: object
      required: [status, service, version, timestamp, database]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [connected, disconnected]
    UserRole:
      type: string
      enum: [customer, staff, admin, super_admin]
    ServiceCategory:
      type: string
      enum: [education, medical, tourism]
    CaseStatus:
      type: string
      enum: [open, closed]
    WorkflowStageStatus:
      type: string
      enum: [pending, in_progress, done, skipped]
    DocumentKind:
      type: string
      enum: [identity, medical, supporting]
    AssignmentStatus:
      type: string
      enum: [unassigned, assigned, exception]
    PaymentMethod:
      type: string
      enum: [bank_transfer]
    PaymentEvidenceStatus:
      type: string
      enum: [submitted, approved, rejected]
    NotificationType:
      type: string
      enum:
        - 'case.message_created'
        - 'case.workflow_stage_transitioned'
        - 'case.closed'
        - 'payment_evidence.submitted'
        - 'payment_evidence.approved'
        - 'payment_evidence.rejected'
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    PageMetaEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PageMeta'
    PublicUser:
      type: object
      required: [id, email, role, displayName, customerId]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        displayName:
          type: ['string', 'null']
        customerId:
          type: ['string', 'null']
    PublicCustomer:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - countryCode
        - assignedManagerUserId
        - assignmentStatus
        - createdByUserId
        - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: ['string', 'null']
          format: email
        phone:
          type: ['string', 'null']
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        assignedManagerUserId:
          type: ['string', 'null']
        assignmentStatus:
          $ref: '#/components/schemas/AssignmentStatus'
        createdByUserId:
          type: ['string', 'null']
        createdAt:
          type: string
          format: date-time
    PublicInvitation:
      type: object
      required: [id, customerId, email, expiresAt, consumedAt, revokedAt, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
        consumedAt:
          type: ['string', 'null']
          format: date-time
        revokedAt:
          type: ['string', 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicCountryAssignment:
      type: object
      required: [id, countryCode, managerUserIds, isActive]
      properties:
        id:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        managerUserIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean
    PublicCity:
      type: object
      required: [id, slug, name, countryCode, isActive]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        isActive:
          type: boolean
    PublicProvider:
      type: object
      required:
        - id
        - name
        - category
        - cityId
        - countryCode
        - website
        - isActive
        - partnershipVerified
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/ServiceCategory'
        cityId:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        website:
          type: ['string', 'null']
          format: uri
        isActive:
          type: boolean
        partnershipVerified:
          type: boolean
    PublicOffering:
      type: object
      required:
        - id
        - slug
        - title
        - summary
        - requirementsSummary
        - category
        - providerId
        - cityId
        - countryCode
        - isActive
        - disclaimer
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        requirementsSummary:
          type: ['string', 'null']
        category:
          $ref: '#/components/schemas/ServiceCategory'
        providerId:
          type: string
        cityId:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        isActive:
          type: boolean
        disclaimer:
          type: string
    PublicPricingRule:
      type: object
      required: [id, customerCountryCode, category, offeringId, amount, currency, isActive]
      properties:
        id:
          type: string
        customerCountryCode:
          type: ['string', 'null']
          description: ISO 3166-1 alpha-2
        category:
          oneOf:
            - $ref: '#/components/schemas/ServiceCategory'
            - type: 'null'
        offeringId:
          type: ['string', 'null']
        amount:
          type: string
          description: Decimal string (2 places)
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        isActive:
          type: boolean
    PublicPaymentAccount:
      type: object
      required:
        - id
        - customerCountryCode
        - currency
        - method
        - label
        - beneficiaryName
        - bankName
        - iban
        - swiftBic
        - referenceHint
        - notes
        - isActive
      properties:
        id:
          type: string
        customerCountryCode:
          type: ['string', 'null']
          description: ISO 3166-1 alpha-2
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        label:
          type: string
        beneficiaryName:
          type: string
        bankName:
          type: string
        iban:
          type: string
        swiftBic:
          type: ['string', 'null']
        referenceHint:
          type: ['string', 'null']
        notes:
          type: ['string', 'null']
        isActive:
          type: boolean
    PublicQuotation:
      type: object
      required: [id, customerId, offeringId, amount, currency, pricingRuleId, snapshot, issuedAt]
      properties:
        id:
          type: string
        customerId:
          type: string
        offeringId:
          type: string
        amount:
          type: string
          description: Decimal string (2 places)
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        pricingRuleId:
          type: string
        snapshot:
          type: object
          required: [offeringTitle, offeringSlug, category, disclaimer, customerCountryCode]
          properties:
            offeringTitle:
              type: string
            offeringSlug:
              type: string
            category:
              $ref: '#/components/schemas/ServiceCategory'
            disclaimer:
              type: string
            customerCountryCode:
              type: string
              description: ISO 3166-1 alpha-2
        issuedAt:
          type: string
          format: date-time
    WorkflowStageDefinition:
      type: object
      required: [id, name, description, order, optional]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ['string', 'null']
        order:
          type: integer
        optional:
          type: boolean
    CaseWorkflowStage:
      allOf:
        - $ref: '#/components/schemas/WorkflowStageDefinition'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/WorkflowStageStatus'
    CaseWorkflowSnapshot:
      type: object
      required: [templateId, versionNumber, stages]
      properties:
        templateId:
          type: string
        versionNumber:
          type: integer
        stages:
          type: array
          items:
            $ref: '#/components/schemas/CaseWorkflowStage'
    PublicCase:
      type: object
      required:
        - id
        - customerId
        - offeringId
        - quotationId
        - status
        - category
        - offeringTitle
        - workflow
        - createdAt
      properties:
        id:
          type: string
        customerId:
          type: string
        offeringId:
          type: string
        quotationId:
          type: ['string', 'null']
        status:
          $ref: '#/components/schemas/CaseStatus'
        category:
          $ref: '#/components/schemas/ServiceCategory'
        offeringTitle:
          type: string
        workflow:
          oneOf:
            - $ref: '#/components/schemas/CaseWorkflowSnapshot'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    PublicCaseDocument:
      type: object
      required: [id, caseId, customerId, kind, originalFilename, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: string
        caseId:
          type: string
        customerId:
          type: string
        kind:
          $ref: '#/components/schemas/DocumentKind'
        originalFilename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
    PublicMessage:
      type: object
      required: [id, caseId, authorUserId, authorRole, body, createdAt]
      properties:
        id:
          type: string
        caseId:
          type: string
        authorUserId:
          type: string
        authorRole:
          $ref: '#/components/schemas/UserRole'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    PublicNotification:
      type: object
      required: [id, type, caseId, metadata, readAt, createdAt]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        caseId:
          type: ['string', 'null']
        metadata:
          type: object
          additionalProperties: true
        readAt:
          type: ['string', 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicPaymentEvidence:
      type: object
      required:
        - id
        - quotationId
        - customerId
        - status
        - originalFilename
        - mimeType
        - sizeBytes
        - reviewNote
        - reviewedAt
        - createdAt
      properties:
        id:
          type: string
        quotationId:
          type: string
        customerId:
          type: string
        status:
          $ref: '#/components/schemas/PaymentEvidenceStatus'
        originalFilename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        reviewNote:
          type: ['string', 'null']
        reviewedAt:
          type: ['string', 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicAuditLog:
      type: object
      required: [id, actorUserId, action, entityType, entityId, metadata, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: ['string', 'null']
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    PublicWorkflowTemplate:
      type: object
      required:
        - id
        - name
        - description
        - category
        - isActive
        - currentVersionNumber
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ['string', 'null']
        category:
          $ref: '#/components/schemas/ServiceCategory'
        isActive:
          type: boolean
        currentVersionNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicWorkflowTemplateVersion:
      type: object
      required: [id, templateId, versionNumber, stages, createdByUserId, createdAt]
      properties:
        id:
          type: string
        templateId:
          type: string
        versionNumber:
          type: integer
        stages:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStageDefinition'
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        displayName:
          type: string
          maxLength: 80
        invitationToken:
          type: string
          minLength: 20
          maxLength: 200
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
    CreateCustomerBody:
      type: object
      required: [fullName, countryCode]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
    ReassignBody:
      type: object
      required: [managerUserId, reason]
      properties:
        managerUserId:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    InviteBody:
      type: object
      properties:
        email:
          type: string
          format: email
    AcceptInvitationBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
    UpsertCountryAssignmentBody:
      type: object
      required: [countryCode, managerUserIds]
      properties:
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        managerUserIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
        isActive:
          type: boolean
          default: true
    CityBody:
      type: object
      required: [slug, name, countryCode]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 60
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        isActive:
          type: boolean
    CityPatchBody:
      type: object
      properties:
        slug:
